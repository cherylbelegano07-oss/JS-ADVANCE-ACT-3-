<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Javascript Web Output #3</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 25px;
      }

      button {
        padding: 6px 12px;
        font-size: 16px;
        margin-right: 8px;
        cursor: pointer;
      }

      .api {
        margin-top: 15px;
        margin-bottom: 10px;
        font-size: 18px;
      }

      table {
        width: 90%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th,
      td {
        border: 1px solid #888;
        padding: 10px;
        text-align: center;
      }

      th {
        font-weight: bold;
      }

      th:nth-child(3),
      td:nth-child(3) {
        text-align: left;
      }

      #loading {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Javascript Web Output #3</h1>

    <button id="btnLoad">Load data from the API</button>
    <button id="btnClear">Clear Table</button>

    <div class="api">
      API:
      <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
        https://jsonplaceholder.typicode.com/todos/
      </a>
    </div>

    <div id="loading"></div>

    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Task ID</th>
          <th>Title</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="tblRecords"></tbody>
    </table>

    <script src="main.js"></script>
  </body>
</html>
